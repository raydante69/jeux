<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Valpré - PC Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/ui.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="960" height="540"></canvas>
    <div id="hud" class="panel">
      <div class="hud-section">
        <span id="hud-day">Jour 1</span>
        <span id="hud-time">06:00</span>
      </div>
      <div class="hud-section">
        <span>Or : <span id="hud-gold">0</span>g</span>
        <span>Énergie : <span id="hud-energy">100</span></span>
      </div>
      <div class="hud-section" id="hud-location">Ferme de Valpré</div>
    </div>
    <div id="toolbar" class="panel"></div>
    <div id="inventory" class="panel hidden">
      <h2>Inventaire</h2>
      <div id="inventory-grid" class="grid"></div>
      <h3>Coffre</h3>
      <div id="chest-grid" class="grid"></div>
    </div>
    <div id="dialogue" class="panel hidden">
      <div id="dialogue-content"></div>
      <button id="dialogue-close">Fermer</button>
    </div>
    <div id="shop" class="panel hidden">
      <h2>Boutique du village</h2>
      <div class="shop-section">
        <h3>Achats</h3>
        <ul id="shop-buy-list"></ul>
      </div>
      <div class="shop-section">
        <h3>Ventes</h3>
        <ul id="shop-sell-list"></ul>
      </div>
      <button id="shop-close">Fermer</button>
    </div>
    <div id="pause" class="panel hidden">
      <h2>Pause</h2>
      <button id="pause-resume">Reprendre</button>
      <button id="pause-sleep">Dormir</button>
      <button id="pause-save">Sauvegarder</button>
    </div>
    <div id="notifications"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
